apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: senate-cloudapps
  annotations:
    description: CloudApps/OKD deployment template for the UNC Undergraduate Senate app.
parameters:
  - name: APP_NAME
    value: senate
  - name: OPENSHIFT_PROJECT
    required: true
    description: Your CloudApps/OKD project name.
  - name: GIT_REPO
    required: true
    description: Git repository URL used by the BuildConfigs.
  - name: GIT_REF
    value: main
  - name: GITHUB_MIRROR_SOURCE
    value: https://github.com/cssgunc/senate.git
    description: Public GitHub repo the mirror CronJob reads from.
  - name: OKD_API_SERVER
    value: https://api.cloudapps.unc.edu:6443
    description: OKD API server the mirror CronJob calls to trigger builds after a successful mirror push.
  - name: MIRROR_SCHEDULE
    value: "*/10 * * * *"
    description: Cron schedule for syncing GITHUB_MIRROR_SOURCE's main branch to GIT_REPO.
  - name: UPTIME_PROBE_SCHEDULE
    value: "*/2 * * * *"
    description: Cron schedule for probing backend/frontend health over the cluster-internal Services and recording the result.
  - name: RUNTIME_ENVIRONMENT
    value: production
  - name: FRONTEND_HOST
    required: true
    description: Public frontend hostname, without https://.
  - name: BACKEND_HOST
    required: true
    description: Public backend hostname, without https://.
  - name: NEXT_PUBLIC_API_URL
    required: true
    description: Public backend origin used by the frontend build, including https://.
  - name: CORS_ORIGINS
    required: true
    description: Comma-separated allowed browser origins for the backend.
  - name: DB_NAME
    value: senate
  - name: DB_USER
    value: senate
  - name: DB_STORAGE_SIZE
    value: 8Gi
  - name: UPLOAD_STORAGE_SIZE
    value: 2Gi
  - name: DB_MEMORY_REQUEST
    value: 256Mi
  - name: DB_MEMORY_LIMIT
    value: 512Mi
  - name: BACKEND_MEMORY_REQUEST
    value: 256Mi
  - name: BACKEND_MEMORY_LIMIT
    value: 512Mi
  - name: FRONTEND_MEMORY_REQUEST
    value: 256Mi
  - name: FRONTEND_MEMORY_LIMIT
    value: 512Mi
objects:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: ${APP_NAME}-backend

  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: ${APP_NAME}-frontend

  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: ${APP_NAME}-backend
    spec:
      source:
        type: Git
        git:
          uri: ${GIT_REPO}
          ref: ${GIT_REF}
        contextDir: backend
      triggers:
        - type: Generic
          generic:
            secretReference:
              name: ${APP_NAME}-generic-webhook
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile
      output:
        to:
          kind: ImageStreamTag
          name: ${APP_NAME}-backend:latest

  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: ${APP_NAME}-frontend
    spec:
      source:
        type: Git
        git:
          uri: ${GIT_REPO}
          ref: ${GIT_REF}
        contextDir: frontend
      triggers:
        - type: Generic
          generic:
            secretReference:
              name: ${APP_NAME}-generic-webhook
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile
          buildArgs:
            - name: NEXT_PUBLIC_API_URL
              value: ${NEXT_PUBLIC_API_URL}
      output:
        to:
          kind: ImageStreamTag
          name: ${APP_NAME}-frontend:latest

  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ${APP_NAME}-github-mirror
    spec:
      schedule: ${MIRROR_SCHEDULE}
      concurrencyPolicy: Forbid
      jobTemplate:
        spec:
          backoffLimit: 2
          activeDeadlineSeconds: 300
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: mirror
                  image: alpine/git:latest
                  command:
                    - /bin/sh
                    - -c
                    - |
                      set -eu
                      mkdir -p "$HOME/.ssh"
                      cp /secrets/ssh-privatekey "$HOME/.ssh/id_ed25519"
                      cp /secrets/known_hosts "$HOME/.ssh/known_hosts"
                      chmod 700 "$HOME/.ssh"
                      chmod 600 "$HOME/.ssh/id_ed25519"
                      git clone --bare "$GITHUB_MIRROR_SOURCE" /tmp/mirror.git
                      cd /tmp/mirror.git
                      push_output="$(git push "$GIT_REPO" "refs/heads/${GIT_REF}:refs/heads/${GIT_REF}" 2>&1)" || { echo "$push_output"; exit 1; }
                      echo "$push_output"
                      if echo "$push_output" | grep -q "Everything up-to-date"; then
                        echo "No new commits mirrored; not triggering a build."
                        exit 0
                      fi
                      echo "New commits mirrored; triggering OKD build webhooks..."
                      wget -S -O - --header="Content-Type: application/json" --post-data="{}" \
                        "${OKD_API_SERVER}/apis/build.openshift.io/v1/namespaces/${OPENSHIFT_PROJECT}/buildconfigs/${APP_NAME}-backend/webhooks/${WEBHOOK_TOKEN}/generic"
                      wget -S -O - --header="Content-Type: application/json" --post-data="{}" \
                        "${OKD_API_SERVER}/apis/build.openshift.io/v1/namespaces/${OPENSHIFT_PROJECT}/buildconfigs/${APP_NAME}-frontend/webhooks/${WEBHOOK_TOKEN}/generic"
                  env:
                    - name: HOME
                      value: /tmp/home
                    - name: GITHUB_MIRROR_SOURCE
                      value: ${GITHUB_MIRROR_SOURCE}
                    - name: GIT_REPO
                      value: ${GIT_REPO}
                    - name: GIT_REF
                      value: ${GIT_REF}
                    - name: OKD_API_SERVER
                      value: ${OKD_API_SERVER}
                    - name: OPENSHIFT_PROJECT
                      value: ${OPENSHIFT_PROJECT}
                    - name: APP_NAME
                      value: ${APP_NAME}
                    - name: WEBHOOK_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: ${APP_NAME}-generic-webhook
                          key: WebHookSecretKey
                  volumeMounts:
                    - name: mirror-key
                      mountPath: /secrets
                      readOnly: true
              volumes:
                - name: mirror-key
                  secret:
                    secretName: ${APP_NAME}-mirror-key
                    defaultMode: 0440

  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ${APP_NAME}-uptime-probe
    spec:
      schedule: ${UPTIME_PROBE_SCHEDULE}
      concurrencyPolicy: Forbid
      # Keep a bit more history than the default (3/1): this job's own pod
      # logs are the only fallback record of a check if the result can't be
      # written to the DB (see the "not set -e" note below).
      successfulJobsHistoryLimit: 5
      failedJobsHistoryLimit: 5
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 60
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: probe
                  image: alpine/git:latest
                  command:
                    - /bin/sh
                    - -c
                    - |
                      # Deliberately no `set -e`: this job's only purpose is
                      # to always emit a best-effort result, so one malformed
                      # measurement (e.g. if a future base image's busybox
                      # date doesn't support %N) must not abort the run.
                      #
                      # Hits both targets over cluster-internal Service DNS,
                      # never the public Route - this can't be affected by
                      # (or need anything from) external DNS/ITS.
                      check_target() {
                        target="$1"
                        url="$2"
                        start_ns=$(date +%s%N 2>/dev/null)
                        http_code="$(wget -T 5 -O /dev/null -S "$url" 2>&1 | awk '/^  HTTP/{print $2; exit}')"
                        end_ns=$(date +%s%N 2>/dev/null)

                        latency_ms=null
                        case "$start_ns$end_ns" in
                          *[!0-9]*) ;; # non-numeric (e.g. unexpanded %N) - leave latency_ms as null
                          *) latency_ms=$(( (end_ns - start_ns) / 1000000 )) ;;
                        esac

                        if [ "$http_code" = "200" ]; then
                          is_up=true
                          error_json=null
                        else
                          is_up=false
                          error_json="\"HTTP ${http_code:-no response}\""
                        fi

                        echo "${target}: is_up=${is_up} http_code=${http_code:-none} latency_ms=${latency_ms}"

                        payload="{\"target\":\"${target}\",\"is_up\":${is_up},\"latency_ms\":${latency_ms},\"error\":${error_json}}"
                        wget -q -O /dev/null \
                          --header="Content-Type: application/json" \
                          --header="X-Analytics-Secret: ${ANALYTICS_INGEST_SECRET}" \
                          --post-data="${payload}" \
                          "http://${APP_NAME}-backend/api/analytics/uptime-check" \
                          || echo "${target}: failed to record check (backend ingest unreachable)"
                      }

                      check_target backend "http://${APP_NAME}-backend/health"
                      check_target frontend "http://${APP_NAME}-frontend/"
                  env:
                    - name: APP_NAME
                      value: ${APP_NAME}
                    - name: ANALYTICS_INGEST_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: ${APP_NAME}-secrets
                          key: ANALYTICS_INGEST_SECRET

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP_NAME}-db-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: ${DB_STORAGE_SIZE}

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP_NAME}-uploads
    spec:
      # ReadWriteMany (not ReadWriteOnce) so a RollingUpdate surge pod can
      # mount this alongside the still-terminating old pod. With RWO, the
      # new pod's mount races the old pod's release of the volume and can
      # hit "Multi-Attach error ... already exclusively attached to one
      # node" - see deploy/cloudapps/README.md's backend rollout section.
      # Backed by the ontap-nas-economy (NFS) storage class, which supports
      # RWX; this can't be changed in place on an existing bound PVC
      # (accessModes is immutable) - see scripts/migrate-uploads-to-rwx.sh.
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: ${UPLOAD_STORAGE_SIZE}

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}-db
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${APP_NAME}-db
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: ${APP_NAME}-db
        spec:
          containers:
            - name: postgres
              image: postgres:16
              ports:
                - containerPort: 5432
                  name: postgres
              env:
                - name: POSTGRES_DB
                  value: ${DB_NAME}
                - name: POSTGRES_USER
                  value: ${DB_USER}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: DB_PASSWORD
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              resources:
                requests:
                  memory: ${DB_MEMORY_REQUEST}
                limits:
                  memory: ${DB_MEMORY_LIMIT}
              volumeMounts:
                - name: db-data
                  mountPath: /var/lib/postgresql/data
              readinessProbe:
                exec:
                  command: ["pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
                initialDelaySeconds: 10
                periodSeconds: 10
              livenessProbe:
                exec:
                  command: ["pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
                initialDelaySeconds: 30
                periodSeconds: 20
          volumes:
            - name: db-data
              persistentVolumeClaim:
                claimName: ${APP_NAME}-db-data

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}-db
    spec:
      selector:
        app: ${APP_NAME}-db
      ports:
        - name: postgres
          port: 5432
          targetPort: 5432

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}-backend
      annotations:
        image.openshift.io/triggers: |
          [{"from":{"kind":"ImageStreamTag","name":"${APP_NAME}-backend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"backend\")].image"}]
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${APP_NAME}-backend
      strategy:
        # RollingUpdate, not Recreate: the old pod keeps serving traffic
        # until the new one passes its readiness probe, so a deploy no
        # longer has a window with zero backend pods up. This and the
        # frontend's own surge together fit the compute-resources quota
        # exactly with zero slack left over - see the memory-limit note
        # in deploy/cloudapps/README.md. Requires the uploads PVC to be
        # ReadWriteMany (see that PVC's comment above) or the surge pod's
        # volume mount will fail with a Multi-Attach error.
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      template:
        metadata:
          labels:
            app: ${APP_NAME}-backend
        spec:
          containers:
            - name: backend
              image: image-registry.openshift-image-registry.svc:5000/${OPENSHIFT_PROJECT}/${APP_NAME}-backend:latest
              imagePullPolicy: Always
              ports:
                - containerPort: 8000
                  name: http
              lifecycle:
                preStop:
                  exec:
                    # Give the Service/Route time to stop sending new
                    # requests to this pod (removing a terminating pod's
                    # endpoint isn't instantaneous) before the container
                    # actually receives SIGTERM.
                    command: ["/bin/sh", "-c", "sleep 5"]
              env:
                - name: ENVIRONMENT
                  value: ${RUNTIME_ENVIRONMENT}
                - name: PORT
                  value: "8000"
                - name: CORS_ORIGINS
                  value: ${CORS_ORIGINS}
                - name: DB_HOST
                  value: ${APP_NAME}-db
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: ${DB_NAME}
                - name: DB_USER
                  value: ${DB_USER}
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: DB_PASSWORD
                - name: JWT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: JWT_SECRET
                - name: ANALYTICS_INGEST_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: ANALYTICS_INGEST_SECRET
                - name: SQLALCHEMY_ECHO
                  value: "false"
                - name: UPLOAD_DIR
                  value: /app/uploads
                - name: UPLOAD_BASE_URL
                  value: /api/uploads
                - name: SMTP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: SMTP_HOST
                - name: SMTP_PORT
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: SMTP_PORT
                - name: SMTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: SMTP_USER
                - name: SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: SMTP_PASSWORD
                - name: SMTP_FROM
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: SMTP_FROM
                - name: SAML_SP_CERT
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: SAML_SP_CERT
                - name: SAML_SP_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: SAML_SP_PRIVATE_KEY
              resources:
                requests:
                  memory: ${BACKEND_MEMORY_REQUEST}
                limits:
                  memory: ${BACKEND_MEMORY_LIMIT}
              volumeMounts:
                - name: uploads
                  mountPath: /app/uploads
              startupProbe:
                # Gates readiness/liveness until the process is actually up
                # (init_db + uvicorn boot), polling often so a fast start
                # doesn't sit behind a flat initialDelaySeconds. Generous
                # failureThreshold covers a slow init_db run without either
                # probe flapping the pod.
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /health/db
                  port: 8000
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 20
          volumes:
            - name: uploads
              persistentVolumeClaim:
                claimName: ${APP_NAME}-uploads

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}-backend
    spec:
      selector:
        app: ${APP_NAME}-backend
      ports:
        - name: http
          port: 80
          targetPort: 8000

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${APP_NAME}-backend
    spec:
      host: ${BACKEND_HOST}
      to:
        kind: Service
        name: ${APP_NAME}-backend
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}-frontend
      annotations:
        image.openshift.io/triggers: |
          [{"from":{"kind":"ImageStreamTag","name":"${APP_NAME}-frontend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"frontend\")].image"}]
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${APP_NAME}-frontend
      strategy:
        # RollingUpdate, same reasoning as the backend. This only fits the
        # compute-resources quota because BACKEND_MEMORY_LIMIT and
        # FRONTEND_MEMORY_LIMIT were both trimmed toward measured usage
        # (see params/senate.env and deploy/cloudapps/README.md) - at the
        # old 512Mi/1Gi limits, a frontend surge pod didn't fit at all.
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      template:
        metadata:
          labels:
            app: ${APP_NAME}-frontend
        spec:
          containers:
            - name: frontend
              image: image-registry.openshift-image-registry.svc:5000/${OPENSHIFT_PROJECT}/${APP_NAME}-frontend:latest
              imagePullPolicy: Always
              ports:
                - containerPort: 3000
                  name: http
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sh", "-c", "sleep 5"]
              env:
                - name: NODE_ENV
                  value: production
                - name: PORT
                  value: "3000"
                - name: NEXT_PUBLIC_API_URL
                  value: ${NEXT_PUBLIC_API_URL}
                - name: ANALYTICS_INGEST_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: ANALYTICS_INGEST_SECRET
              resources:
                requests:
                  memory: ${FRONTEND_MEMORY_REQUEST}
                limits:
                  memory: ${FRONTEND_MEMORY_LIMIT}
              startupProbe:
                httpGet:
                  path: /
                  port: 3000
                periodSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /
                  port: 3000
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: /
                  port: 3000
                periodSeconds: 20

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}-frontend
    spec:
      selector:
        app: ${APP_NAME}-frontend
      ports:
        - name: http
          port: 80
          targetPort: 3000

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${APP_NAME}-frontend
    spec:
      host: ${FRONTEND_HOST}
      to:
        kind: Service
        name: ${APP_NAME}-frontend
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
