name: Deploy

# Manual-only. Automatic deploys happen via the senate-github-mirror CronJob
# in OKD: it mirrors main to sc.unc.edu and triggers the OKD build itself
# right after a successful push, which avoids racing the mirror (see
# deploy/cloudapps/README.md). This workflow is a fallback for forcing a
# rebuild of whatever sc.unc.edu currently has, without waiting for the
# CronJob's next scheduled run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: senate

    steps:
      - name: Determine environment
        id: env
        shell: bash
        run: |
          echo "head_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Select webhook URLs
        shell: bash
        env:
          OKD_BACKEND_WEBHOOK_URL: ${{ secrets.OKD_BACKEND_WEBHOOK_URL }}
          OKD_FRONTEND_WEBHOOK_URL: ${{ secrets.OKD_FRONTEND_WEBHOOK_URL }}
        run: |
          backend_url="$OKD_BACKEND_WEBHOOK_URL"
          frontend_url="$OKD_FRONTEND_WEBHOOK_URL"

          if [[ -z "$backend_url" || -z "$frontend_url" ]]; then
            echo "Missing OKD webhook URLs" >&2
            exit 1
          fi

          {
            echo "BACKEND_WEBHOOK_URL=$backend_url"
            echo "FRONTEND_WEBHOOK_URL=$frontend_url"
          } >> "$GITHUB_ENV"

      - name: Trigger OKD webhooks
        shell: bash
        env:
          HEAD_BRANCH: ${{ steps.env.outputs.head_branch }}
          HEAD_SHA: ${{ steps.env.outputs.head_sha }}
        run: |
          payload_file="$(mktemp)"
          trap 'rm -f "$payload_file"' EXIT
          printf '{"git":{"ref":"refs/heads/%s","commit":"%s"}}\n' "$HEAD_BRANCH" "$HEAD_SHA" > "$payload_file"

          for webhook_url in "$BACKEND_WEBHOOK_URL" "$FRONTEND_WEBHOOK_URL"; do
            curl --fail --silent --show-error \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary "@$payload_file" \
              "$webhook_url"
          done
